[project]
name = "nueva-ruta-runtime"
version = "0.1.0"
description = "Local runtime foundation for Nueva Ruta"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["apps/api/src", "apps/simulator/src"]
testpaths = ["apps/api/tests", "apps/simulator/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["supabase/.temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nueva_ruta_api", "nueva_ruta_simulator"]
mypy_path = ["apps/api/src", "apps/simulator/src"]
